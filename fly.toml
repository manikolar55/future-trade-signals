[app]
name = "future-trade-signals"
primary_region = "sin"

[build]
  [build.args]
    PYTHON_VERSION = "3.12.7"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
